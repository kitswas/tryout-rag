[project]
name = "tryout-rag"
version = "0.1.0"
description = "RAG demo using Hugging Face and LangChain"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
	"beautifulsoup4>=4.14.3",
	"faiss-cpu>=1.13.2",
	"langchain>=1.2.10",
	"langchain-community>=0.4.1",
	"langchain-huggingface>=1.2.1",
	"lxml>=6.0.2",
	"sentence-transformers>=5.2.3",
	"transformers>=5.3.0",
	"streamlit>=1.55.0",
]

[dependency-groups]
dev = ["pdoc>=16.0.0", "pytest>=9.0.2", "ruff>=0.15.0"]

# Enable if needed. Highly recommended for better code.
[tool.ruff.lint]
extend-select = [
	# 	"ANN", # type annotations
	"UP",  # pyupgrade
	"PLE", # pylint errors
]

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = ["ANN"]
